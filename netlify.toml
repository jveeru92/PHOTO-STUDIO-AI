[build]
  base = "."
  command = "cd frontend && npm ci && npm run build"
  publish = "frontend/dist"
  functions = "functions"

[dev]
  command = "cd frontend && npm run dev"
  port = 8888
  functions = "functions"
  framework = "#vite"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
