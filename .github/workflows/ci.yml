name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Type-check frontend
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Lint check (no committed secrets)
        run: |
          if grep -rE "sk-live|sk_test|sk_live|AKIA|-----BEGIN (RSA|EC|DSA) PRIVATE KEY" frontend functions .env* 2>/dev/null; then
            echo "Possible secret detected"; exit 1;
          fi
          echo "No secrets detected"

      - name: Production build
        run: npm run build
        working-directory: frontend
